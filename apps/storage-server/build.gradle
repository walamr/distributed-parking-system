plugins {
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

application {
    mainClass = 'edu.kinneret.parking.storage.StorageServerApplication'
}

def java21Launcher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':common')
    implementation 'com.rabbitmq:amqp-client:5.21.0'
    implementation 'org.mongodb:mongodb-driver-sync:5.1.0'
    implementation 'com.google.code.gson:gson:2.11.0'

    testImplementation platform('org.junit:junit-bom:5.10.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

tasks.named('jar') {
    manifest {
        attributes 'Main-Class': 'edu.kinneret.parking.storage.StorageServerApplication'
    }
}

shadowJar {
    archiveBaseName = 'database-service'
    archiveVersion = '1.0'
    archiveClassifier = ''
    manifest {
        attributes 'Main-Class': 'edu.kinneret.parking.storage.StorageServerApplication'
    }
    mergeServiceFiles()
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.build.configure {
    dependsOn tasks.shadowJar
}

tasks.named('startShadowScripts') {
    dependsOn tasks.jar
}

tasks.register('runStorageServer', JavaExec) {
    group = 'application'
    description = 'Runs the storage-server application.'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'edu.kinneret.parking.storage.StorageServerApplication'
    javaLauncher = java21Launcher
    workingDir = rootProject.projectDir
}
