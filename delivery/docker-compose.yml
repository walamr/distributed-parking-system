# LEGACY / ARCHIVED COMPOSE FILE.
# This file belongs to an older pre-hardening package that used MySQL and
# plaintext RabbitMQ. It is not the current Stage 2 deployment. Use the
# repository-root docker-compose.yml for the current MongoDB/RabbitMQ TLS cluster.

version: '3.9'

services:
  # 1. MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: mulligan-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mulligan
      MYSQL_USER: mulligan_user
      MYSQL_PASSWORD: mulligan_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./config/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./config/database/sample_data.sql:/docker-entrypoint-initdb.d/02-sample_data.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mulligan-network
    command: --default-authentication-plugin=mysql_native_password

  # 2. RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: mulligan-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: rabbitmq_user
      RABBITMQ_DEFAULT_PASS: rabbitmq_password
    ports:
      - "5672:5672"    # AMQP port
      - "15672:15672"  # Management UI port
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - mulligan-network

  # 3. Database Service Backend
  database-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: mulligan-database-service
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mulligan
      SPRING_DATASOURCE_USERNAME: mulligan_user
      SPRING_DATASOURCE_PASSWORD: mulligan_password
      SPRING_RABBITMQ_HOST: rabbitmq
    ports:
      - "8080:8080"
    volumes:
      - ./bin/database-service-1.0.0-SNAPSHOT.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    networks:
      - mulligan-network

  # 4. Queue Service
  queue-service:
    image: eclipse-temurin:21-jre-jammy
    container_name: mulligan-queue-service
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: rabbitmq_user
      SPRING_RABBITMQ_PASSWORD: rabbitmq_password
    volumes:
      - ./bin/queue-service-1.0.0-SNAPSHOT.jar:/app.jar
    command: ["java", "-jar", "/app.jar"]
    networks:
      - mulligan-network

  # 5. UI Applications (Skeletal for architectural compliance)
  customer-ui:
    image: eclipse-temurin:21-jre-jammy
    container_name: mulligan-customer-ui
    environment:
      MULLIGAN_DATABASE_BASE_URL: http://database-service:8080
    volumes:
      - ./bin/customer-ui-1.0.0-SNAPSHOT.jar:/app.jar
    command: ["java", "-Dtestfx.robot=glass", "-Dtestfx.headless=true", "-Dprism.order=sw", "-Dprism.text=t2k", "-Djava.awt.headless=true", "-jar", "/app.jar"]
    networks:
      - mulligan-network

  peo-ui:
    image: eclipse-temurin:21-jre-jammy
    container_name: mulligan-peo-ui
    environment:
      MULLIGAN_DATABASE_BASE_URL: http://database-service:8080
    volumes:
      - ./bin/peo-ui-1.0.0-SNAPSHOT.jar:/app.jar
    command: ["java", "-Dtestfx.robot=glass", "-Dtestfx.headless=true", "-Dprism.order=sw", "-Dprism.text=t2k", "-Djava.awt.headless=true", "-jar", "/app.jar"]
    networks:
      - mulligan-network

  mo-ui:
    image: eclipse-temurin:21-jre-jammy
    container_name: mulligan-mo-ui
    environment:
      MULLIGAN_DATABASE_BASE_URL: http://database-service:8080
    volumes:
      - ./bin/mo-ui-1.0.0-SNAPSHOT.jar:/app.jar
    command: ["java", "-Dtestfx.robot=glass", "-Dtestfx.headless=true", "-Dprism.order=sw", "-Dprism.text=t2k", "-Djava.awt.headless=true", "-jar", "/app.jar"]
    networks:
      - mulligan-network

networks:
  mulligan-network:
    driver: bridge

volumes:
  mysql_data:
  rabbitmq_data:
