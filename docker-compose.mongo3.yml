# docker-compose for mongo3 host only
# Run with: docker compose --env-file network-ips.env -f docker-compose.mongo3.yml up -d
services:
  mongo3:
    image: mongo:7.0
    container_name: mongo3
    hostname: mongo3
    env_file:
      - network-ips.env
    extra_hosts:
      - "mongo1:${MONGO1_IP}"
      - "mongo2:${MONGO2_IP}"
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown 999 /tmp/mongodb-keyfile &&
      exec mongod --replSet rs0 --port 27017 --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo3.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "0.0.0.0:27017:27017"
    cap_add:
      - NET_ADMIN
    volumes:
      - mongo3-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
    networks:
      - parking-net

networks:
  parking-net:
    driver: bridge

volumes:
  mongo3-data:
