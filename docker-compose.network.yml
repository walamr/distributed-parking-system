services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
    ports:
      # <- Changed 127.0.0.1 to 0.0.0.0 to allow network connections
      - "0.0.0.0:5671:5671"
      - "0.0.0.0:15671:15671"
    volumes:
      - rabbitmq1-data-v3:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - parking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
    ports:
      - "0.0.0.0:5671:5671"
      - "0.0.0.0:15671:15671"
    volumes:
      - rabbitmq2-data-v3:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - parking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbitmq3:
    image: rabbitmq:3.13-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq3
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
    ports:
      - "0.0.0.0:5671:5671"
      - "0.0.0.0:15671:15671"
    volumes:
      - rabbitmq3-data-v3:/var/lib/rabbitmq
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - parking-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo1.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      # <- Changed 127.0.0.1 to 0.0.0.0 and unified port to 27017
      - "0.0.0.0:27017:27017"
    networks:
      - parking-net
    volumes:
      - mongo1-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo2.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "0.0.0.0:27017:27017"
    networks:
      - parking-net
    volumes:
      - mongo2-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --bind_ip_all --tlsMode requireTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo3.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "0.0.0.0:27017:27017"
    networks:
      - parking-net
    volumes:
      - mongo3-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

networks:
  parking-net:
    # <- Removed internal: true to allow external network connections
    driver: bridge

volumes:
  rabbitmq1-data-v3:
  rabbitmq2-data-v3:
  rabbitmq3-data-v3:
  mongo1-data:
  mongo2-data:
  mongo3-data:
