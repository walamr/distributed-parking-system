services:
  rabbitmq1:
    image: rabbitmq:3.13-management
    container_name: rabbitmq1
    hostname: rabbitmq1
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq1
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      HOME: /tmp
    ports:
      - "127.0.0.1:5671:5671"
      - "127.0.0.1:15671:15671"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - rabbitmq-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbitmq2:
    image: rabbitmq:3.13-management
    container_name: rabbitmq2
    hostname: rabbitmq2
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq2
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      HOME: /tmp
    ports:
      - "127.0.0.1:5673:5671"
      - "127.0.0.1:15673:15671"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - rabbitmq-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  rabbitmq3:
    image: rabbitmq:3.13-management
    container_name: rabbitmq3
    hostname: rabbitmq3
    environment:
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:-mulligan-secure-cookie-rotated-99213}
      RABBITMQ_NODENAME: rabbit@rabbitmq3
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      RABBITMQ_CTL_ERL_ARGS: "-proto_dist inet_tls -ssl_dist_optfile /etc/rabbitmq/inter_node_tls.config"
      HOME: /tmp
    ports:
      - "127.0.0.1:5674:5671"
      - "127.0.0.1:15674:15671"
    volumes:
      - ./docker/rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - ./docker/rabbitmq/inter_node_tls.config:/etc/rabbitmq/inter_node_tls.config:ro
    networks:
      - rabbitmq-internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_local_alarms"]
      interval: 15s
      timeout: 10s
      retries: 5

  # --- Distributed Database (MongoDB Replica Set) ---
  mongo1:
    image: mongo:7.0
    container_name: mongo1
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --bind_ip_all --tlsMode preferTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo1.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - rabbitmq-internal
    volumes:
      - mongo1-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

  mongo2:
    image: mongo:7.0
    container_name: mongo2
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --port 27018 --bind_ip_all --tlsMode preferTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo2.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "127.0.0.1:27018:27018"
    networks:
      - rabbitmq-internal
    volumes:
      - mongo2-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

  mongo3:
    image: mongo:7.0
    container_name: mongo3
    command: >
      bash -c "
      cp /etc/mongo/certs/mongodb-keyfile /tmp/mongodb-keyfile &&
      chmod 600 /tmp/mongodb-keyfile &&
      chown mongodb:mongodb /tmp/mongodb-keyfile &&
      mongod --replSet rs0 --port 27019 --bind_ip_all --tlsMode preferTLS --tlsCertificateKeyFile /etc/mongo/certs/mongo3.pem --tlsCAFile /etc/mongo/certs/ca-cert.pem --tlsAllowConnectionsWithoutCertificates --keyFile /tmp/mongodb-keyfile
      "
    ports:
      - "127.0.0.1:27019:27019"
    networks:
      - rabbitmq-internal
    volumes:
      - mongo3-data:/data/db
      - ./docker/mongodb/certs:/etc/mongo/certs:ro

  recommender1:
    image: eclipse-temurin:21-jre-alpine
    container_name: recommender1
    volumes:
      - ./apps/recommender-server/build/libs:/app
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
      - ./docker/rabbitmq/certs:/etc/recommender/certs:ro
      - recommender1-logs:/var/log/mulligan
    working_dir: /
    environment:
      - MONGO_TLS_ENABLED=true
      - MONGO_TLS_CA_CERT_PATH=/etc/mongo/certs/ca-cert.pem
      - MONGO_TLS_ALLOW_INVALID_HOSTNAMES=false
      - HMAC_SECRET=${HMAC_SECRET}
      - RABBITMQ_NODES=rabbitmq1:5671,rabbitmq2:5671,rabbitmq3:5671
      - RABBITMQ_TRUSTSTORE_PATH=/etc/recommender/certs/truststore.jks
      - RABBITMQ_TRUSTSTORE_PASSWORD=${RABBITMQ_TRUSTSTORE_PASSWORD:-password}
      - RABBITMQ_KEYSTORE_PATH=/etc/recommender/certs/keystore.jks
      - RABBITMQ_KEYSTORE_PASSWORD=${RABBITMQ_KEYSTORE_PASSWORD:-password}
      - SECURITY_LOG_PATH=/var/log/mulligan/recommender-security.log
    command: java -jar /app/recommender-service-1.0.jar --cli nodeId=recommender1 port=8091 leaderHost=recommender1 leaderPort=8091 isLeader=true malicious=${RECOMMENDER1_MALICIOUS:-false} nodes=recommender1:8091,recommender2:8092,recommender3:8093
    ports:
      - "8091:8091"
    networks:
      - rabbitmq-internal

  recommender2:
    image: eclipse-temurin:21-jre-alpine
    container_name: recommender2
    volumes:
      - ./apps/recommender-server/build/libs:/app
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
      - ./docker/rabbitmq/certs:/etc/recommender/certs:ro
      - recommender2-logs:/var/log/mulligan
    working_dir: /
    environment:
      - MONGO_TLS_ENABLED=true
      - MONGO_TLS_CA_CERT_PATH=/etc/mongo/certs/ca-cert.pem
      - MONGO_TLS_ALLOW_INVALID_HOSTNAMES=false
      - HMAC_SECRET=${HMAC_SECRET}
      - RABBITMQ_NODES=rabbitmq1:5671,rabbitmq2:5671,rabbitmq3:5671
      - RABBITMQ_TRUSTSTORE_PATH=/etc/recommender/certs/truststore.jks
      - RABBITMQ_TRUSTSTORE_PASSWORD=${RABBITMQ_TRUSTSTORE_PASSWORD:-password}
      - RABBITMQ_KEYSTORE_PATH=/etc/recommender/certs/keystore.jks
      - RABBITMQ_KEYSTORE_PASSWORD=${RABBITMQ_KEYSTORE_PASSWORD:-password}
      - SECURITY_LOG_PATH=/var/log/mulligan/recommender-security.log
    command: java -jar /app/recommender-service-1.0.jar --cli nodeId=recommender2 port=8092 leaderHost=recommender1 leaderPort=8091 isLeader=false malicious=${RECOMMENDER2_MALICIOUS:-false} nodes=recommender1:8091,recommender2:8092,recommender3:8093
    ports:
      - "8092:8092"
    networks:
      - rabbitmq-internal

  recommender3:
    image: eclipse-temurin:21-jre-alpine
    container_name: recommender3
    volumes:
      - ./apps/recommender-server/build/libs:/app
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
      - ./docker/rabbitmq/certs:/etc/recommender/certs:ro
      - recommender3-logs:/var/log/mulligan
    working_dir: /
    environment:
      - MONGO_TLS_ENABLED=true
      - MONGO_TLS_CA_CERT_PATH=/etc/mongo/certs/ca-cert.pem
      - MONGO_TLS_ALLOW_INVALID_HOSTNAMES=false
      - HMAC_SECRET=${HMAC_SECRET}
      - RABBITMQ_NODES=rabbitmq1:5671,rabbitmq2:5671,rabbitmq3:5671
      - RABBITMQ_TRUSTSTORE_PATH=/etc/recommender/certs/truststore.jks
      - RABBITMQ_TRUSTSTORE_PASSWORD=${RABBITMQ_TRUSTSTORE_PASSWORD:-password}
      - RABBITMQ_KEYSTORE_PATH=/etc/recommender/certs/keystore.jks
      - RABBITMQ_KEYSTORE_PASSWORD=${RABBITMQ_KEYSTORE_PASSWORD:-password}
      - SECURITY_LOG_PATH=/var/log/mulligan/recommender-security.log
    command: java -jar /app/recommender-service-1.0.jar --cli nodeId=recommender3 port=8093 leaderHost=recommender1 leaderPort=8091 isLeader=false malicious=${RECOMMENDER3_MALICIOUS:-false} nodes=recommender1:8091,recommender2:8092,recommender3:8093
    ports:
      - "8093:8093"
    networks:
      - rabbitmq-internal

  queue-server:
    image: eclipse-temurin:21-jre-alpine
    container_name: queue-server
    restart: on-failure
    volumes:
      - ./apps/queue-server/build/libs:/app
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - queue-server-logs:/var/log/mulligan
    working_dir: /
    environment:
      - MONGO_TLS_ENABLED=true
      - MONGO_TLS_CA_CERT_PATH=/etc/mongo/certs/ca-cert.pem
      - MONGO_TLS_ALLOW_INVALID_HOSTNAMES=false
      - HMAC_SECRET=${HMAC_SECRET}
      - RABBITMQ_NODES=rabbitmq1:5671,rabbitmq2:5671,rabbitmq3:5671
      - RABBITMQ_TRUSTSTORE_PATH=/etc/rabbitmq/certs/truststore.jks
      - RABBITMQ_TRUSTSTORE_PASSWORD=${RABBITMQ_TRUSTSTORE_PASSWORD:-password}
      - RABBITMQ_KEYSTORE_PATH=/etc/rabbitmq/certs/keystore.jks
      - RABBITMQ_KEYSTORE_PASSWORD=${RABBITMQ_KEYSTORE_PASSWORD:-password}
      - SECURITY_LOG_PATH=/var/log/mulligan/queue-security.log
    command: java -jar /app/queue-service-1.0.jar
    networks:
      - rabbitmq-internal

  storage-server:
    image: eclipse-temurin:21-jre-alpine
    container_name: storage-server
    restart: on-failure
    volumes:
      - ./apps/storage-server/build/libs:/app
      - ./docker/mongodb/certs:/etc/mongo/certs:ro
      - ./docker/rabbitmq/certs:/etc/rabbitmq/certs:ro
      - storage-server-logs:/var/log/mulligan
    working_dir: /
    environment:
      - MONGO_TLS_ENABLED=true
      - MONGO_TLS_CA_CERT_PATH=/etc/mongo/certs/ca-cert.pem
      - MONGO_TLS_ALLOW_INVALID_HOSTNAMES=false
      - HMAC_SECRET=${HMAC_SECRET}
      - RABBITMQ_NODES=rabbitmq1:5671,rabbitmq2:5671,rabbitmq3:5671
      - RABBITMQ_TRUSTSTORE_PATH=/etc/rabbitmq/certs/truststore.jks
      - RABBITMQ_TRUSTSTORE_PASSWORD=${RABBITMQ_TRUSTSTORE_PASSWORD:-password}
      - RABBITMQ_KEYSTORE_PATH=/etc/rabbitmq/certs/keystore.jks
      - RABBITMQ_KEYSTORE_PASSWORD=${RABBITMQ_KEYSTORE_PASSWORD:-password}
      - SECURITY_LOG_PATH=/var/log/mulligan/storage-security.log
    command: java -jar /app/database-service-1.0.jar
    networks:
      - rabbitmq-internal

networks:
  rabbitmq-internal:
    driver: bridge

volumes:
  rabbitmq1-data-v3:
  rabbitmq2-data-v3:
  rabbitmq3-data-v3:
  mongo1-data:
  mongo2-data:
  mongo3-data:
  recommender1-logs:
  recommender2-logs:
  recommender3-logs:
  queue-server-logs:
  storage-server-logs:
