# Shared RabbitMQ configuration for local development.
# The queue-server application uses per-service credentials instead of default credentials.

# Hardened RabbitMQ configuration
management.load_definitions = /etc/rabbitmq/definitions.json

# Disable plaintext listeners (Hardening R1-C-01 / R1-A-03)
listeners.tcp = none
management.tcp.ip = 127.0.0.1

# Keep the guest account loopback-only in case it is ever created (Hardening R1-I-02)
loopback_users.guest = true

# TLS Configuration (Hardening against sniffing)
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/ca-cert.pem
ssl_options.certfile = /etc/rabbitmq/certs/server-cert.pem
ssl_options.keyfile = /etc/rabbitmq/certs/server-key.pem
ssl_options.verify = verify_peer
ssl_options.fail_if_no_peer_cert = true
ssl_options.versions.1 = tlsv1.2
ssl_options.versions.2 = tlsv1.3

# Management HTTPS Configuration
management.ssl.port = 15671
management.ssl.cacertfile = /etc/rabbitmq/certs/ca-cert.pem
management.ssl.certfile = /etc/rabbitmq/certs/server-cert.pem
management.ssl.keyfile = /etc/rabbitmq/certs/server-key.pem
management.ssl.versions.1 = tlsv1.2
management.ssl.versions.2 = tlsv1.3

# --- NEW: Auto-Clustering Configuration ---
cluster_formation.peer_discovery_backend = rabbit_peer_discovery_classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq3
